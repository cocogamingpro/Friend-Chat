<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huddle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--ink:#1e2140;--ink2:#2c3060;--paper:#f3f1fb;--vio:#5546ff;--mint:#2fd6a1;--sun:#ffd23f;--txt:#1b1c2e;--mut:#7a7c9c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--txt)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.av{width:42px;height:42px;border-radius:14px;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
.av.lg{width:88px;height:88px;border-radius:28px;font-size:34px}
input[type=text]{padding:12px 14px;border:2px solid #e1def4;border-radius:12px;width:100%;background:#fff}
.btn{background:var(--vio);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}
.btn.alt{background:#ece9fb;color:var(--vio)}
.err{color:#d6275a;min-height:1.3em;font-size:14px}
.pick{display:flex;align-items:center;gap:14px;cursor:pointer;color:var(--vio);font-weight:600}

#auth{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--ink)}
.card{background:#fff;padding:32px;border-radius:28px;width:min(400px,100%);display:grid;gap:16px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
.card p{color:var(--mut)}

#app{display:grid;grid-template-columns:330px 1fr;height:100%}
aside{background:var(--ink);color:#fff;display:flex;flex-direction:column;min-height:0}
#me{display:flex;align-items:center;gap:12px;padding:18px}
#me>div{flex:1;min-width:0;display:grid;gap:3px}
#me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#idc{background:var(--sun);color:#1b1c2e;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;justify-self:start;letter-spacing:.04em}
.ghost{color:#c4c7f5;padding:6px 10px;border-radius:8px}
.ghost:hover{background:var(--ink2)}
.acts{display:flex;gap:8px;padding:0 18px 14px}
.acts button{flex:1;background:var(--ink2);padding:10px;border-radius:12px;font-weight:600}
.acts button:hover{background:#383d78}
#list{flex:1;overflow:auto;padding:0 10px 14px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:left;position:relative}
.row:hover{background:var(--ink2)}
.row.on{background:var(--vio)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row small{color:#aab;font-size:12px}
.row em{background:var(--sun);color:#1b1c2e;border-radius:99px;min-width:22px;text-align:center;font-style:normal;font-weight:800;font-size:12px;padding:1px 6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mint)}
.empty{color:#aab;padding:12px}

main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
#none{margin:auto;text-align:center;color:var(--mut);padding:20px}
#chat{display:flex;flex-direction:column;height:100%;min-height:0}
#head{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid #e6e3f6}
#head div{min-width:0}
#head b{display:block}
#head small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{display:none;font-size:22px;padding:4px 8px}
#msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:6px}
.m{display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,520px)}
.m.mine{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--mut);margin:6px 0 2px 4px;font-weight:600}
.b{background:#fff;padding:8px 12px;border-radius:16px 16px 16px 4px}
.mine .b{background:var(--vio);color:#fff;border-radius:16px 16px 4px 16px}
.b p{white-space:pre-wrap;overflow-wrap:anywhere}
.b time{display:block;font-size:11px;opacity:.55;margin-top:2px}
.gif{display:block;max-width:240px;width:100%;border-radius:10px;margin-bottom:4px}
#form{display:flex;gap:8px;padding:12px 18px;background:#fff;border-top:1px solid #e6e3f6;align-items:center}
#form .ic{font-size:20px;padding:6px 8px;border-radius:10px}
#form .ic:hover,#form .ic.on{background:#ece9fb}
#gifbtn{font-weight:800;font-size:13px!important;color:var(--vio)}
#panel{background:#fff;border-top:1px solid #e6e3f6;padding:10px 18px;max-height:240px;overflow:auto}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
#emo button{font-size:22px;padding:4px;border-radius:8px}
#emo button:hover{background:#ece9fb}
#gifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
#gifs img{width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:pointer}
#gifs .note{grid-column:1/-1;color:var(--mut)}

dialog{border:0;border-radius:24px;padding:28px;width:min(420px,calc(100% - 32px));margin:auto}
dialog::backdrop{background:#1e214099}
dialog form,.stack{display:grid;gap:14px}
dialog h2{font-size:24px;letter-spacing:-.02em}
.fl{max-height:180px;overflow:auto;display:grid;gap:4px}
.fl label{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer}
.fl label:hover{background:#f3f1fb}
.fl input{width:18px;height:18px;accent-color:var(--vio)}
.bar{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:9}

@media(max-width:720px){
  #app{grid-template-columns:1fr}
  body.open aside,body:not(.open) main{display:none}
  #back{display:block}
  .m{max-width:88%}
}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
</head>
<body>

<section id="auth" hidden>
  <div class="card">
    <h1>Huddle</h1>
    <p>Pick a name and an icon, get your ID, and share it so friends can add you.</p>
    <label class="pick"><input type="file" accept="image/*" hidden><span class="pv"></span><span>Choose an icon</span></label>
    <input type="text" id="aname" maxlength="24" placeholder="Your name" autocomplete="off">
    <p class="err" id="aerr"></p>
    <button class="btn" id="go">Start chatting</button>
  </div>
</section>

<div id="app" hidden>
  <aside>
    <div id="me"></div>
    <div class="acts"><button id="addf">Add friend</button><button id="newg">New group</button></div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="none"><h1>No chat open</h1><p>Pick a friend or group on the left.</p></div>
    <div id="chat" hidden>
      <div id="head"><button id="back" aria-label="Back">←</button><span id="hav"></span><div><b id="hn"></b><small id="hs"></small></div></div>
      <div id="msgs"></div>
      <div id="panel" hidden></div>
      <form id="form">
        <button type="button" class="ic" id="emobtn" aria-label="Emojis">😊</button>
        <button type="button" class="ic" id="gifbtn" aria-label="GIFs">GIF</button>
        <input type="text" id="txt" maxlength="1000" placeholder="Write a message" autocomplete="off">
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s), sock = io();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => [...String(s)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 360;
const av = (x, cls = '') => x.icon
  ? `<img class="av ${cls}" src="${esc(x.icon)}" alt="">`
  : `<span class="av ${cls}" style="background:hsl(${hue(x.id || x.name)} 55% 45%)">${esc(x.name[0].toUpperCase())}</span>`;
const dmKey = (a, b) => 'dm:' + [a, b].sort().join('-');
const EMO = '😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😜 🤪 😎 🤩 🥳 😏 😒 😞 😔 😢 😭 😤 😠 🤯 😳 🥵 🥶 😱 😨 🤔 🤭 🤫 🙄 😴 🤤 😷 🥴 😈 💀 👻 👽 🤖 💩 🙈 🙉 🙊 👍 👎 👏 🙌 🙏 💪 👀 🧠 ❤️ 🧡 💛 💚 💙 💜 🖤 💔 🔥 ✨ 🎉 🎂 🍕 🍔 🍟 🍺 ☕ ⚽ 🎮 🎵 🚀 🌈 ☀️ 🌙 ⭐'.split(' ');

let S = null, cur = null, H = {}, N = {}, pend = '';
const token = () => localStorage.getItem('chat_token');
let toastT;
function toast(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 2000); }

// ---------- icon picker ----------
function resize(file) {
  return new Promise(r => {
    const i = new Image();
    i.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const s = Math.min(i.width, i.height);
      c.getContext('2d').drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, 96, 96);
      r(c.toDataURL('image/webp', .8));
    };
    i.src = URL.createObjectURL(file);
  });
}
function bindPick(root, init) {
  pend = init ? init.icon || '' : undefined;
  const pv = root.querySelector('.pv');
  pv.innerHTML = av(init || { name: '?', id: 'new' }, 'lg');
  root.querySelector('input[type=file]').onchange = async e => {
    if (!e.target.files[0]) return;
    pend = await resize(e.target.files[0]);
    pv.innerHTML = av({ name: '?', icon: pend }, 'lg');
  };
}

// ---------- auth ----------
function showAuth() { $('#app').hidden = true; $('#auth').hidden = false; bindPick($('#auth'), null); pend = ''; }
$('#go').onclick = () => {
  sock.emit('register', { name: $('#aname').value, icon: pend }, r => {
    if (r.error) return $('#aerr').textContent = r.error;
    localStorage.setItem('chat_token', r.token); setState(r.state);
  });
};
sock.on('connect', () => {
  if (!token()) return showAuth();
  sock.emit('login', token(), r => {
    if (r.error) { localStorage.removeItem('chat_token'); showAuth(); toast('Your account was reset. Create a new one.'); }
    else setState(r.state);
  });
});

// ---------- state & list ----------
const chats = () => [
  ...S.friends.map(i => ({ key: dmKey(S.me.id, i), u: S.users[i], type: 'dm' })),
  ...S.groups.map(g => ({ key: 'g:' + g.id, u: g, type: 'g' }))
].filter(c => c.u);

function setState(st) {
  S = st; $('#auth').hidden = true; $('#app').hidden = false;
  $('#me').innerHTML = `${av(S.me)}<div><b>${esc(S.me.name)}</b><button id="idc" title="Copy your ID">ID: ${S.me.id}</button></div><button class="ghost" id="edit">Edit</button>`;
  $('#idc').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(S.me.id); toast('ID copied'); };
  $('#edit').onclick = profileDlg;
  renderList(); head();
  if (cur && !H[cur]) loadHistory();
}
sock.on('state', setState);

function renderList() {
  const L = chats();
  $('#list').innerHTML = L.length ? L.map(c => `<button class="row ${c.key === cur ? 'on' : ''}" data-k="${c.key}">${av(c.u)}<span class="nm">${esc(c.u.name)}</span>${c.type === 'dm' && c.u.online ? '<i class="dot" title="Online"></i>' : ''}${c.type === 'g' ? `<small>${c.u.members.length} members</small>` : ''}${N[c.key] ? `<em>${N[c.key]}</em>` : ''}</button>`).join('')
    : '<p class="empty">No chats yet. Add a friend using their ID to get started.</p>';
  document.querySelectorAll('.row').forEach(b => b.onclick = () => openChat(b.dataset.k));
}

// ---------- chat ----------
function head() {
  const c = cur && chats().find(x => x.key === cur);
  if (!c) { cur = null; document.body.classList.remove('open'); $('#chat').hidden = true; $('#none').hidden = false; return; }
  $('#none').hidden = true; $('#chat').hidden = false;
  $('#hav').innerHTML = av(c.u); $('#hn').textContent = c.u.name;
  $('#hs').textContent = c.type === 'dm' ? (c.u.online ? 'Online' : 'Offline') : c.u.members.map(i => S.users[i] ? S.users[i].name : '?').join(', ');
}
function loadHistory() { const k = cur; sock.emit('history', k, m => { H[k] = m; if (k === cur) drawMsgs(); }); }
function openChat(k) {
  cur = k; N[k] = 0; document.body.classList.add('open'); $('#panel').hidden = true;
  head(); renderList(); loadHistory(); $('#txt').focus();
}
$('#back').onclick = () => { cur = null; head(); renderList(); };

function drawMsgs() {
  const box = $('#msgs'), grp = cur.startsWith('g:'); let last = '';
  box.innerHTML = (H[cur] || []).map(m => {
    const mine = m.from === S.me.id, u = S.users[m.from] || { name: 'Former member' };
    const who = grp && !mine && last !== m.from ? `<span class="who">${esc(u.name)}</span>` : '';
    last = m.from;
    return `<div class="m ${mine ? 'mine' : ''}">${who}<div class="b">${m.gif ? `<img class="gif" src="${esc(m.gif)}" alt="GIF">` : ''}${m.text ? `<p>${esc(m.text)}</p>` : ''}<time>${new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</time></div></div>`;
  }).join('');
  box.querySelectorAll('.gif').forEach(i => i.onload = () => box.scrollTop = box.scrollHeight);
  box.scrollTop = box.scrollHeight;
}
sock.on('msg', m => {
  (H[m.chat] = H[m.chat] || []).push(m);
  if (m.chat === cur) drawMsgs();
  else if (m.from !== S.me.id) { N[m.chat] = (N[m.chat] || 0) + 1; renderList(); }
});
const send = d => cur && sock.emit('send', { chat: cur, ...d });
$('#form').onsubmit = e => { e.preventDefault(); const t = $('#txt').value.trim(); if (t) { send({ text: t }); $('#txt').value = ''; } };

// ---------- emoji & GIF panel ----------
function openPanel(kind) {
  const p = $('#panel');
  if (!p.hidden && p.dataset.k === kind) { p.hidden = true; return; }
  p.hidden = false; p.dataset.k = kind;
  if (kind === 'emo') {
    p.innerHTML = '<div id="emo">' + EMO.map(e => `<button type="button">${e}</button>`).join('') + '</div>';
    p.querySelectorAll('button').forEach(b => b.onclick = () => { const t = $('#txt'); t.value += b.textContent; t.focus(); });
  } else {
    p.innerHTML = '<input type="text" id="gq" placeholder="Search GIFs" autocomplete="off"><div id="gifs"></div>';
    $('#gq').oninput = e => { clearTimeout(window.gt); window.gt = setTimeout(() => loadGifs(e.target.value), 350); };
    loadGifs('');
  }
}
async function loadGifs(q) {
  const box = $('#gifs'); if (!box) return;
  const r = await (await fetch('/api/gifs?q=' + encodeURIComponent(q))).json();
  if (r.error) {
    box.innerHTML = '<p class="note">GIF search is off (no Giphy key set). Paste a GIF link (https) instead:</p>';
    $('#gq').placeholder = 'https://…/funny.gif';
    $('#gq').oninput = null;
    $('#gq').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); send({ gif: e.target.value.trim() }); e.target.value = ''; $('#panel').hidden = true; } };
    return;
  }
  box.innerHTML = r.gifs.length ? r.gifs.map(g => `<img src="${esc(g.preview)}" data-u="${esc(g.url)}" alt="GIF">`).join('') : '<p class="note">No GIFs found.</p>';
  box.querySelectorAll('img').forEach(i => i.onclick = () => { send({ gif: i.dataset.u }); $('#panel').hidden = true; });
}
$('#emobtn').onclick = () => openPanel('emo');
$('#gifbtn').onclick = () => openPanel('gif');

// ---------- dialogs ----------
const D = $('#dlg');
const show = h => { D.innerHTML = h; D.showModal(); };
const pickHtml = '<label class="pick"><input type="file" accept="image/*" hidden><span class="pv"></span><span>Choose an icon</span></label>';

$('#addf').onclick = () => {
  show(`<form method="dialog" class="stack" id="f"><h2>Add a friend</h2><p>Ask your friend for their ID. It's shown at the top of their sidebar.</p><input type="text" id="fid" placeholder="Friend's ID" maxlength="12" autocomplete="off"><p class="err" id="e"></p><div class="bar"><button class="btn alt" value="x">Cancel</button><button class="btn" id="ok" type="button">Add friend</button></div></form>`);
  $('#ok').onclick = () => sock.emit('addFriend', $('#fid').value, r => {
    if (r.error) return $('#e').textContent = r.error;
    D.close(); toast('Friend added'); setTimeout(() => openChat(dmKey(S.me.id, r.id)), 100);
  });
};

$('#newg').onclick = () => {
  const fr = S.friends.map(i => S.users[i]).filter(Boolean);
  show(`<form method="dialog" class="stack"><h2>New group</h2>${pickHtml}<input type="text" id="gn" placeholder="Group name" maxlength="24" autocomplete="off"><b>Add friends</b><div class="fl">${fr.length ? fr.map(f => `<label><input type="checkbox" value="${f.id}">${av(f)}${esc(f.name)}</label>`).join('') : '<p class="empty" style="color:var(--mut)">Add a friend first.</p>'}</div><p class="err" id="e"></p><div class="bar"><button class="btn alt" value="x">Cancel</button><button class="btn" id="ok" type="button">Create group</button></div></form>`);
  bindPick(D, { name: '?', id: 'g' }); pend = '';
  $('#ok').onclick = () => sock.emit('createGroup', { name: $('#gn').value, icon: pend, members: [...D.querySelectorAll('.fl input:checked')].map(c => c.value) }, r => {
    if (r.error) return $('#e').textContent = r.error;
    D.close(); setTimeout(() => openChat('g:' + r.id), 100);
  });
};

function profileDlg() {
  show(`<form method="dialog" class="stack"><h2>Your profile</h2>${pickHtml}<input type="text" id="pn" maxlength="24" value="${esc(S.me.name)}"><div class="bar"><button class="btn alt" value="x">Cancel</button><button class="btn" id="ok" type="button">Save</button></div></form>`);
  bindPick(D, S.me);
  $('#ok').onclick = () => { sock.emit('profile', { name: $('#pn').value, icon: pend }); D.close(); };
}
</script>
</body>
</html>
